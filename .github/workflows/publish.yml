name: Publish validated APK
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build cleanMYTV run containing the reviewed APK
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify the successful build and publish its exact APK
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_RUN: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEWED_RUN" > /tmp/validated-run.json
          python3 - <<'PY'
          import json, os, subprocess
          run=json.load(open('/tmp/validated-run.json'))
          assert run['conclusion']=='success' and run['status']=='completed'
          assert run['name']=='Build cleanMYTV'
          assert run['head_repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          assert run['head_branch'] in ('main','feature/reference-parity','feature/lime-ui','feature/app-updates','feature/optional-malaysia-azan')
          subprocess.run(['git','merge-base','--is-ancestor',run['head_sha'],'HEAD'],check=True)
          subprocess.run(['git','diff','--exit-code',run['head_sha'],'HEAD','--','.',':!.github',':!README.md',':!previews',':(exclude,glob)**/src/test/screenshots/*.png'],check=True)
          open('/tmp/validated-sha','w').write(run['head_sha'])
          PY
          gh run download "$REVIEWED_RUN" --repo "$GITHUB_REPOSITORY" --name cleanMYTV-apk --dir dist
          test -s dist/cleanMYTV.apk
          sha256sum --check dist/SHA256SUMS.txt
          python3 scripts/verify-app-package.py dist/cleanMYTV.apk release
          python3 - <<'PY'
          import json
          info=json.load(open('dist/release-info.json'))
          assert info['signing']=='release'
          assert info['versionName']=='1.3.0-beta2' and info['versionCode']==7
          PY
          cat > /tmp/release-notes.md <<'NOTES'
          cleanMYTV 1.3.0 beta2 — tambah app pada menu TV serta pilihan Waktu Solat & Azan Malaysia.

          Dalam cleanMYTV lama, tekan Kemas kini untuk mendapatkan APK ini. Binaan menggunakan nama pakej dan kunci release yang sama seperti 1.3.0 beta1, dengan nombor versi lebih tinggi; pasang terus tanpa menyahpasang app atau membuang rekod.

          Menu TV: butang tambah app, baris baharu secara automatik apabila baris pertama penuh, dan App library untuk app Android biasa.

          Waktu solat & azan ialah fungsi pilihan, dimatikan secara lalai. Tambah melalui menu skrin utama TV dalam telefon, kemudian pilih negeri/daerah daripada 60 zon Malaysia. Audio Subuh berasingan disertakan, bersama audio biasa untuk Zohor, Asar, Maghrib dan Isyak. Syuruk tidak memainkan azan. Terdapat butang percubaan, pilihan paparan penuh sehingga audio tamat, serta kawalan matikan/buang. Jadual JAKIM melalui Solat.my; audio CC BY 3.0 dengan kredit dalam modul. Paparan penuh bukan kunci mutlak semua firmware.

          Same-package, same-key in-place update from 1.3.0 beta1. Adds optional Malaysian prayer times and azan, separate bundled Fajr audio, and improved TV Home app selection. Existing Update controls discover this beta and offer the official APK. Android still asks before installation; downloads remain blocked during unfinished TV operations.

          Android 9+ phone required. Core connection, analysis, cleaning and recovery functions remain in place. Physical TV compatibility still needs device testing. Upstream MIT copyright and third-party notices are retained.
          NOTES
          gh release create v1.3.0-beta2 dist/cleanMYTV.apk dist/SHA256SUMS.txt dist/SIGNING_CERTIFICATE.txt dist/release-info.json --repo "$GITHUB_REPOSITORY" --target "$(cat /tmp/validated-sha)" --prerelease --title 'cleanMYTV 1.3.0 beta2 — Waktu Solat & Azan' --notes-file /tmp/release-notes.md
