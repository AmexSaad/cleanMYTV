name: Publish validated APK
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build cleanMYTV run containing the reviewed APK
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify the successful build and publish its exact APK
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_RUN: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEWED_RUN" > /tmp/validated-run.json
          python3 - <<'PY'
          import json, os, subprocess
          run=json.load(open('/tmp/validated-run.json'))
          assert run['conclusion']=='success' and run['status']=='completed'
          assert run['name']=='Build cleanMYTV'
          assert run['head_repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          assert run['head_branch'] in ('main','feature/reference-parity','feature/lime-ui')
          subprocess.run(['git','merge-base','--is-ancestor',run['head_sha'],'HEAD'],check=True)
          subprocess.run(['git','diff','--exit-code',run['head_sha'],'HEAD','--','.',':!.github',':!README.md',':!previews',':(exclude,glob)**/src/test/screenshots/*.png'],check=True)
          open('/tmp/validated-sha','w').write(run['head_sha'])
          PY
          gh run download "$REVIEWED_RUN" --repo "$GITHUB_REPOSITORY" --name cleanMYTV-apk --dir dist
          test -s dist/cleanMYTV.apk
          sha256sum --check dist/SHA256SUMS.txt
          cat > /tmp/release-notes.md <<'NOTES'
          cleanMYTV 1.2.2 beta1 — fungsi asas Clean Your TV v0.4.6-beta2, dengan reka bentuk Hitam + Limau, logo 03 Monogram pada ikon aplikasi dan dalam app, serta Bahasa Melayu / English.

          Muat turun cleanMYTV.apk dan pasang pada telefon Android 9+. Telefon dan TV mesti menggunakan rangkaian yang sama. Panduan sambungan disediakan dalam app. Binaan ini ialah beta debug; keserasian TV fizikal masih perlu disahkan. Rekod versi lama kekal tetapi tidak diimport ke jurnal baharu. Pulihkan perubahan yang diperlukan menggunakan versi lama sebelum menggantikan app.

          Download cleanMYTV.apk for an Android 9+ phone. This beta uses the reference connection, analysis, cleaning, home-screen and recovery flows with a graphite and lime BM/EN interface and the selected Monogram 03 logo on the launcher icon and in the app. Physical TV compatibility is not yet verified. Legacy records are retained but not imported into the new journal.

          Tandatangan debug beta ini berbeza daripada beta terdahulu. Android menolak kemas kini terus jika tandatangan berbeza. Selesaikan pemulihan TV yang diperlukan menggunakan app lama sebelum menyahpasangnya. / This debug beta has a different signing certificate from earlier betas. Finish any needed TV restoration with the old app before uninstalling it.

          Upstream MIT copyright and third-party notices are retained. See the README for source credits and upgrade information.
          NOTES
          gh release create v1.2.2-beta1 dist/cleanMYTV.apk dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$(cat /tmp/validated-sha)" --prerelease --title 'cleanMYTV 1.2.2 beta1' --notes-file /tmp/release-notes.md
