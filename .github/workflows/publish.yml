name: Publish validated APK
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build cleanMYTV run containing the reviewed APK
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify the successful build and publish its exact APK
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_RUN: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEWED_RUN" > /tmp/validated-run.json
          python3 - <<'PY'
          import json, os, subprocess
          run=json.load(open('/tmp/validated-run.json'))
          assert run['conclusion']=='success' and run['status']=='completed'
          assert run['name']=='Build cleanMYTV'
          assert run['head_repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          assert run['head_branch'] in ('main','feature/reference-parity','feature/lime-ui','feature/app-updates')
          subprocess.run(['git','merge-base','--is-ancestor',run['head_sha'],'HEAD'],check=True)
          subprocess.run(['git','diff','--exit-code',run['head_sha'],'HEAD','--','.',':!.github',':!README.md',':!previews',':(exclude,glob)**/src/test/screenshots/*.png'],check=True)
          open('/tmp/validated-sha','w').write(run['head_sha'])
          PY
          gh run download "$REVIEWED_RUN" --repo "$GITHUB_REPOSITORY" --name cleanMYTV-apk --dir dist
          test -s dist/cleanMYTV.apk
          sha256sum --check dist/SHA256SUMS.txt
          python3 scripts/verify-app-package.py dist/cleanMYTV.apk release
          python3 - <<'PY'
          import json
          info=json.load(open('dist/release-info.json'))
          assert info['signing']=='release'
          assert info['versionName']=='1.3.0-beta1' and info['versionCode']>=6
          PY
          cat > /tmp/release-notes.md <<'NOTES'
          cleanMYTV 1.3.0 beta1 — butang Kemas kini / Update dalam BM dan English, logo 03 Monogram dan tema Hitam + Limau.

          Semak versi GitHub termasuk beta, lihat nota perubahan dan muat turun APK daripada repo rasmi cleanMYTV. Buka fail yang dimuat turun dan sahkan pemasangan Android. Semakan tidak berjalan secara automatik ketika app dibuka. Muat turun dihalang apabila operasi TV belum selesai.

          Keluaran ini menggunakan kunci tandatangan release tetap. Kemas kini seterusnya yang menggunakan kunci ini boleh dipasang tanpa menyahpasang app. Beta debug 1.2.x terdahulu mempunyai tandatangan berbeza: selesaikan pemulihan TV yang diperlukan dengan app lama sebelum menyahpasangnya untuk pemasangan pertama keluaran ini.

          This release adds an Update button, correct stable/beta version checks, release notes and direct APK download from the cleanMYTV repository. Android still asks the user to confirm installation. Downloads are blocked while a TV operation is unfinished. A permanent release signing identity replaces the earlier temporary debug certificates; future releases using this identity support in-place upgrades. Earlier 1.2.x debug betas require a one-time reinstall after completing any needed TV recovery with the old app.

          Android 9+ phone required. Core connection, analysis, cleaning and recovery functions remain in place. Physical TV compatibility still needs device testing. Upstream MIT copyright and third-party notices are retained.
          NOTES
          gh release create v1.3.0-beta1 dist/cleanMYTV.apk dist/SHA256SUMS.txt dist/SIGNING_CERTIFICATE.txt dist/release-info.json --repo "$GITHUB_REPOSITORY" --target "$(cat /tmp/validated-sha)" --prerelease --title 'cleanMYTV 1.3.0 beta1' --notes-file /tmp/release-notes.md
