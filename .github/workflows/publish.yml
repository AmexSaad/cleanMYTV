name: Publish validated APK
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build cleanMYTV run containing the reviewed APK
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify the successful build and publish its exact APK
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_RUN: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEWED_RUN" > /tmp/validated-run.json
          python3 - <<'PY'
          import json, os, subprocess
          run=json.load(open('/tmp/validated-run.json'))
          assert run['conclusion']=='success' and run['status']=='completed'
          assert run['name']=='Build cleanMYTV'
          assert run['head_repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          assert run['head_branch'] in ('main','feature/reference-parity','feature/lime-ui','feature/app-updates','feature/optional-malaysia-azan')
          subprocess.run(['git','merge-base','--is-ancestor',run['head_sha'],'HEAD'],check=True)
          # The phone screenshot harness is not packaged in the APK. It may receive emulator
          # readiness fixes between attempts; all Android/Gradle/assets must still match exactly.
          subprocess.run(['git','diff','--exit-code',run['head_sha'],'HEAD','--','.',':!.github',':!README.md',':!previews',':!scripts/capture-phone-ui.py',':(exclude,glob)**/src/test/screenshots/*.png'],check=True)
          open('/tmp/validated-sha','w').write(run['head_sha'])
          PY
          gh run download "$REVIEWED_RUN" --repo "$GITHUB_REPOSITORY" --name cleanMYTV-apk --dir dist
          test -s dist/cleanMYTV.apk
          sha256sum --check dist/SHA256SUMS.txt
          python3 scripts/verify-app-package.py dist/cleanMYTV.apk release
          python3 scripts/extract-tv-package.py dist/cleanMYTV.apk
          python3 - <<'PY'
          import json
          info=json.load(open('dist/release-info.json'))
          assert info['signing']=='release'
          assert info['versionName']=='1.3.0-beta4' and info['versionCode']==9
          PY
          cat > /tmp/release-notes.md <<'NOTES'
          cleanMYTV 1.3.0 beta4 — Menu TV lengkap: + tambah app, widget waktu solat hidup dan Prayer Time.

          DOWNLOAD: cleanMYTV.apk untuk telefon Android 9+. Prayer-Time-TV.apk ialah modul/menu untuk Android TV/box Android 8+ dan juga disertakan dalam APK telefon.

          WAJIB SEKALI: Update app telefon, buka Menu TV & Prayer Time dan tekan Kemas kini menu TV & Prayer Time. Pada TV, buka tetapan Home, pilih Prayer Time dan sahkan Change/Tukar. Selepas itu butang Home membuka menu baharu. Launcher lama kekal dipasang sebagai pilihan kembali.

          Baharu: butang + Tambah app terus dalam dock; carian nama/pakej membaca app TV dan app Android biasa terus daripada box; widget Home memaparkan zon, kelima-lima waktu solat dan waktu seterusnya; ikon Prayer Time muncul pada dock dan widget. Pilihan dock disimpan pada box. Menghantar gambar/dock tidak mematikan azan dengan force-stop.

          Poster nombor 2 dan teks dinamik dikekalkan, bersama audio Subuh berasingan. Tiada video atau iklan. Pilih zon Malaysia dan hidupkan audio/paparan penuh jika mahu. Popup menutup app biasa sehingga audio tamat; ujian emulator meliputi Home, Back dan app QA lain. Bukan mod kiosk mutlak semua firmware; ujian fizikal box pengguna belum tersedia.

          Cara guna dan screenshot: https://github.com/AmexSaad/cleanMYTV/blob/main/tv/prayer/HOME.md
          Nota penuh: https://github.com/AmexSaad/cleanMYTV/blob/main/CHANGELOG.md

          Android 9+ phone required. Core connection, analysis, cleaning and recovery functions remain in place. Physical TV compatibility still needs device testing. Upstream MIT copyright and third-party notices are retained.
          NOTES
          gh release create v1.3.0-beta4 dist/cleanMYTV.apk dist/Prayer-Time-TV.apk dist/SHA256SUMS.txt dist/TV-SHA256SUMS.txt dist/SIGNING_CERTIFICATE.txt dist/release-info.json dist/tv-release-info.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'cleanMYTV 1.3.0 beta4 — Menu TV: + App, Widget & Prayer Time' --notes-file /tmp/release-notes.md
