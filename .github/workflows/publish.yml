name: Publish validated APK
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build cleanMYTV run containing the reviewed APK
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify the successful build and publish its exact APK
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_RUN: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEWED_RUN" > /tmp/validated-run.json
          python3 - <<'PY'
          import json, os, subprocess
          run=json.load(open('/tmp/validated-run.json'))
          assert run['conclusion']=='success' and run['status']=='completed'
          assert run['name']=='Build cleanMYTV'
          assert run['head_repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          assert run['head_branch'] in ('main','feature/reference-parity','feature/lime-ui','feature/app-updates','feature/optional-malaysia-azan')
          subprocess.run(['git','merge-base','--is-ancestor',run['head_sha'],'HEAD'],check=True)
          subprocess.run(['git','diff','--exit-code',run['head_sha'],'HEAD','--','.',':!.github',':!README.md',':!previews',':(exclude,glob)**/src/test/screenshots/*.png'],check=True)
          open('/tmp/validated-sha','w').write(run['head_sha'])
          PY
          gh run download "$REVIEWED_RUN" --repo "$GITHUB_REPOSITORY" --name cleanMYTV-apk --dir dist
          test -s dist/cleanMYTV.apk
          sha256sum --check dist/SHA256SUMS.txt
          python3 scripts/verify-app-package.py dist/cleanMYTV.apk release
          python3 - <<'PY'
          import json
          info=json.load(open('dist/release-info.json'))
          assert info['signing']=='release'
          assert info['versionName']=='1.3.0-beta3' and info['versionCode']==8
          PY
          cat > /tmp/release-notes.md <<'NOTES'
          cleanMYTV 1.3.0 beta3 — Prayer Time dengan poster azan dinamik, reka bentuk masjid biru malam pilihan pengguna.

          Dalam cleanMYTV lama, tekan Kemas kini untuk mendapatkan APK ini. Nama pakej dan kunci release kekal; versi kod 8 boleh dipasang terus ke atas beta2 tanpa membuang app atau rekod.

          Baharu: akses Prayer Time & azan terus pada dashboard telefon. Tambah atau kemas kini modul sedia ada, kemudian buka Prayer Time pada TV untuk memilih zon dan mengaktifkan audio/paparan penuh. Nama dan ikon/banner modul turut dikemas kini.

          Poster: satu latar masjid malam ringan; teks nama solat, waktu jadual sebenar hari itu dan kawasan/zon pilihan berubah secara automatik. Bukan gambar dengan teks contoh kekal. Tiada video, YouTube, iklan atau muat turun media. Latar WebP sekitar 180 KB. Audio Subuh berasingan dikekalkan. Popup ditutup selepas audio tamat; percubaan kelima-lima waktu disediakan dan dilabel sebagai pratonton. Pilihan hidup/mati kekal, dengan audio serta paparan penuh dimatikan secara lalai.

          App dock: app yang baru dipasang pada TV tidak lagi hilang daripada senarai hanya kerana rekod TV lama. App TV dan app Android biasa yang mempunyai pintasan boleh dipilih. Tiada perubahan launcher untuk widget hidup pada Home atau butang + dalam slot kosong dalam keluaran ini.

          Jadual JAKIM melalui Solat.my, 60 zon Malaysia. Penggera menggunakan waktu Malaysia, bukan zon masa telefon. Paparan penuh memerlukan kebenaran overlay dan bukan kunci mutlak semua firmware. Existing Update controls discover this signed beta; Android still asks before installation, and unfinished TV operations block downloads. After updating the phone app, use Prayer Time on the dashboard to update the TV companion too.

          Android 9+ phone required. Core connection, analysis, cleaning and recovery functions remain in place. Physical TV compatibility still needs device testing. Upstream MIT copyright and third-party notices are retained.
          NOTES
          gh release create v1.3.0-beta3 dist/cleanMYTV.apk dist/SHA256SUMS.txt dist/SIGNING_CERTIFICATE.txt dist/release-info.json --repo "$GITHUB_REPOSITORY" --target "$(cat /tmp/validated-sha)" --prerelease --title 'cleanMYTV 1.3.0 beta3 — Prayer Time: Poster Azan Dinamik' --notes-file /tmp/release-notes.md
