name: Build cleanMYTV
on:
  push:
    branches: [main, feature/reference-parity]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cleanmytv-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Import the pinned reference source and reviewed cleanMYTV changes
        if: hashFiles('migration/cleanmytv-brand.patch') != ''
        env:
          SOURCE_DIR: ${{ runner.temp }}/cleanmytv-reference
        run: |
          set -euo pipefail
          echo '6d9ec29b35ba78c8e3b41d52b39603a4207fc1221225ed9aa08c202086c92db7  migration/cleanmytv-brand.patch' | sha256sum --check
          git clone --no-checkout https://github.com/udhaykumarbala/cleanyourtv-app.git "$SOURCE_DIR"
          git -C "$SOURCE_DIR" checkout 0413da3068c563d8325f14f782209927f9783e1d
          git -C "$SOURCE_DIR" apply --check "$GITHUB_WORKSPACE/migration/cleanmytv-brand.patch"
          git -C "$SOURCE_DIR" apply "$GITHUB_WORKSPACE/migration/cleanmytv-brand.patch"
          python3 - <<'PY'
          import os, pathlib, shutil, subprocess
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          source = pathlib.Path(os.environ['SOURCE_DIR']).resolve()
          assert root != source and root.is_dir() and source.is_dir()
          # Remove only tracked files from this feature branch; Git retains the previous version.
          tracked = subprocess.check_output(['git','ls-files','-z'], cwd=root).decode().split('\0')
          for name in filter(None, tracked):
              if name == '.github/workflows/build.yml': continue
              path = root / name
              assert path.resolve().is_relative_to(root)
              if path.is_file() or path.is_symlink(): path.unlink()
          for entry in source.iterdir():
              if entry.name in ('.git', '.github', 'third_party'): continue
              target = root / entry.name
              if entry.is_dir(): shutil.copytree(entry, target, dirs_exist_ok=True)
              else: shutil.copy2(entry, target)
          shutil.copytree(source / '.github/ISSUE_TEMPLATE', root / '.github/ISSUE_TEMPLATE', dirs_exist_ok=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git update-index --add --cacheinfo 160000,b06ab21105c49900cb1ed76b24414dba1e21d0db,third_party/cleanyourtv
          git commit -m 'Use pinned Clean Your TV beta2 functions with cleanMYTV interface and BM/EN'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git submodule update --init --recursive
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Build full debug APK and verify bundled TV assets
        run: |
          chmod +x gradlew
          ./gradlew :core:trust:verifyLauncherPin :core:trust:verifyCurtainPin checkModuleGraph :app:assembleFullDebug --console=plain
      - name: Test connection, planning, operations, recovery and app integration
        run: ./gradlew :core:model:check :core:spec:check :core:ops:check :core:probe:check :core:planner:check :core:engine:check :core:backup:check :core:flows:check :core:trust:check :core:registry:check :adb:wire:check :adb:pairing:check :adb:session:check :app:testFullDebugUnitTest :e2e:check --continue --console=plain
      - name: Record refreshed UI screenshots and run feature interaction tests
        run: ./gradlew recordRoborazziDebug --continue --console=plain
      - name: Verify refreshed UI screenshots
        run: ./gradlew verifyRoborazziDebug --continue --console=plain
      - name: Package APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/full/debug/app-full-debug.apk dist/cleanMYTV.apk
          sha256sum dist/cleanMYTV.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cleanMYTV-apk
          path: dist/
          if-no-files-found: error
      - name: Test reports and UI previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cleanMYTV-checks
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/src/test/screenshots/*.png
            **/build/outputs/roborazzi/
          retention-days: 7
