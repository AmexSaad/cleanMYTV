name: Build APK

on:
  push:
    branches: [main, feature/custom-mylauncher]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Name APK cleanMYTV
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/cleanMYTV.apk
      - name: Show errors
        if: failure()
        run: |
          grep -E '^e: ' build.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: cleanMYTV-apk
          path: app/build/outputs/apk/debug/cleanMYTV.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check MyLauncher screens on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/workflows/verify-launcher.sh
      - name: Save UI screenshots and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mylauncher-ui-checks
          path: |
            ui-screenshots
            app/build/reports/tests
            app/build/reports/androidTests
            instrumentation.log
          if-no-files-found: warn
