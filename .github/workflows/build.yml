name: Build cleanMYTV
on:
  push:
    branches: [main, feature/reference-parity]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cleanmytv-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Build full APK and verify bundled TV assets
        run: |
          chmod +x gradlew
          ./gradlew :core:trust:verifyLauncherPin :core:trust:verifyCurtainPin checkModuleGraph :app:assembleFullDebug --console=plain
      - name: Test connection, plans, operations, recovery and app integration
        run: ./gradlew :core:model:check :core:spec:check :core:ops:check :core:probe:check :core:planner:check :core:engine:check :core:backup:check :core:flows:check :core:trust:check :core:registry:check :adb:wire:check :adb:pairing:check :adb:session:check :app:testFullDebugUnitTest :e2e:check --continue --console=plain
      - name: Record refreshed screenshots and test feature interactions
        run: ./gradlew recordRoborazziDebug --continue --console=plain
      - name: Save feature storyboard for visual review
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          shots = [('connect','welcome_found_one','01 / Sambung TV'),('connect','picker_two_tvs','02 / Pilih TV'),('setup','found_simple','03 / Semak analisis'),('setup','working_58','04 / Bersihkan'),('setup','check_84s','05 / Sahkan Home'),('manage','manage_clean','06 / Urus dan pulihkan')]
          font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',18)
          title = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',30)
          canvas = Image.new('RGB',(1200,1840),'#eaf1fb')
          draw=ImageDraw.Draw(canvas)
          draw.text((32,20),'cleanMYTV / Pratonton fungsi',font=title,fill='#14233c')
          draw.text((32,65),'Komponen sebenar / Data contoh / Header app tidak ditunjukkan',font=font,fill='#435671')
          for index,(module,name,label) in enumerate(shots):
              image=Image.open(f'feature/{module}/src/test/screenshots/{name}_light.png').convert('RGB')
              image.thumbnail((360,780))
              x=30+(index%3)*395; y=110+(index//3)*855
              draw.text((x,y),label,font=font,fill='#155dcc')
              canvas.paste(image,(x,y+35))
          Path('previews').mkdir(exist_ok=True)
          canvas.save('previews/storyboard.png')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/ ':(glob)**/src/test/screenshots/*.png'
          if ! git diff --cached --quiet; then
            git commit -m 'Record cleanMYTV UI goldens and feature storyboard'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Verify refreshed screenshots
        run: ./gradlew verifyRoborazziDebug --continue --console=plain
      - name: Package APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/full/debug/app-full-debug.apk dist/cleanMYTV.apk
          sha256sum dist/cleanMYTV.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cleanMYTV-apk
          path: dist/
          if-no-files-found: error
      - name: Summarize tests and print any failures
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          tests=failures=errors=0
          for path in glob.glob('**/build/test-results/**/TEST-*.xml',recursive=True):
              root=ET.parse(path).getroot()
              tests+=int(root.get('tests',0)); failures+=int(root.get('failures',0)); errors+=int(root.get('errors',0))
              for case in root.findall('testcase'):
                  for error in list(case.findall('failure'))+list(case.findall('error')):
                      print(f"{path}: {case.get('name')}: {(error.text or '')[:2500]}")
          summary=f'Tests: {tests}; failures: {failures}; errors: {errors}\n'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(summary)
          PY
      - name: Test reports and previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cleanMYTV-checks
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/outputs/roborazzi/
            previews/
          retention-days: 7
  phone-preview:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: cleanMYTV-apk
          path: apk-download
      - name: Enable emulator acceleration on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture installed app in English and Malay
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install apk-download/cleanMYTV.apk
            mkdir -p previews
            adb shell input keyevent 82
            printf '<?xml version="1.0" encoding="utf-8" standalone="yes" ?><map><string name="language">en</string></map>' > /tmp/cleanmytv-language.xml
            adb push /tmp/cleanmytv-language.xml /data/local/tmp/cleanmytv-language.xml
            adb shell run-as my.cleanmytv.app mkdir -p shared_prefs
            adb shell "run-as my.cleanmytv.app sh -c 'cat /data/local/tmp/cleanmytv-language.xml > shared_prefs/cleanmytv-ui.xml'"
            adb shell am start -n my.cleanmytv.app/tv.cleanyour.app.MainActivity
            sleep 12
            adb shell uiautomator dump /sdcard/cleanmytv-window.xml
            adb pull /sdcard/cleanmytv-window.xml previews/phone-en.xml
            grep -q 'A cleaner TV' previews/phone-en.xml
            adb shell screencap -p /sdcard/cleanmytv-phone-en.png
            adb pull /sdcard/cleanmytv-phone-en.png previews/phone-en.png
            adb shell am force-stop my.cleanmytv.app
            printf '<?xml version="1.0" encoding="utf-8" standalone="yes" ?><map><string name="language">ms</string></map>' > /tmp/cleanmytv-language.xml
            adb push /tmp/cleanmytv-language.xml /data/local/tmp/cleanmytv-language.xml
            adb shell "run-as my.cleanmytv.app sh -c 'cat /data/local/tmp/cleanmytv-language.xml > shared_prefs/cleanmytv-ui.xml'"
            adb shell am start -n my.cleanmytv.app/tv.cleanyour.app.MainActivity
            sleep 10
            adb shell uiautomator dump /sdcard/cleanmytv-window.xml
            adb pull /sdcard/cleanmytv-window.xml previews/phone-ms.xml
            grep -q 'TV lebih kemas' previews/phone-ms.xml
            adb shell screencap -p /sdcard/cleanmytv-phone-ms.png
            adb pull /sdcard/cleanmytv-phone-ms.png previews/phone-ms.png
      - name: Save installed app screenshots for review
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/phone-en.png previews/phone-ms.png
          if ! git diff --cached --quiet; then
            git commit -m 'Capture installed cleanMYTV on Android 15 in BM and English'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cleanMYTV-phone-preview
          path: previews/
